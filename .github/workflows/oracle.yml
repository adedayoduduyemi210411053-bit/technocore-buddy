name: Autonomous Oracle Agent (Every 5 Mins)

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-oracle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Reconstruct Identity File
        env:
          PEM_SECRET: "${{ secrets.IDENTITY_PEM }}"
        run: |
          echo "$PEM_SECRET" > identity.pem
          
      - name: Run Oracle Agent (Once)
        env:
          IDENTITY_PASSWORD: "${{ secrets.IDENTITY_PASSWORD }}"
        run: python useful_oracle_agent.py --once
