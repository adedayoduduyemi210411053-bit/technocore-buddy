name: Autonomous Oracle & tclk Deal Daemon (Every 5 Mins)

on:
  schedule:
    - cron: '0 */4 * * *'  # Automatically launches a fresh 4-hour runner every 4 hours
  workflow_dispatch:
  push:
    branches: [ master ]

concurrency:
  group: oracle-continuous-daemon
  cancel-in-progress: true  # Prevents overlapping runners by cleanly renewing

jobs:
  run-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Maximum runner allowance
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Reconstruct Identity File
        env:
          PEM_SECRET: "${{ secrets.IDENTITY_PEM }}"
        run: |
          echo "$PEM_SECRET" > identity.pem
          
      - name: Run Continuous Oracle Daemon (Every 5 Mins)
        env:
          IDENTITY_PASSWORD: "${{ secrets.IDENTITY_PASSWORD }}"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
        run: python useful_oracle_agent.py --interval 300 --duration 4.0
