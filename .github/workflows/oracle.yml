name: Autonomous Oracle & Trading Daemon (Every 5 Mins)

on:
  schedule:
    - cron: '0 */4 * * *'  # Fallback cron trigger
  workflow_dispatch:
  push:
    branches: [ master ]

concurrency:
  group: oracle-continuous-daemon
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  run-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          npm install

      - name: Reconstruct Identity Files
        env:
          PEM_SECRET: "${{ secrets.IDENTITY_PEM }}"
          FLEET_ALPHA: "${{ secrets.FLEET_ALPHA_PEM }}"
          FLEET_BETA: "${{ secrets.FLEET_BETA_PEM }}"
          FLEET_GAMMA: "${{ secrets.FLEET_GAMMA_PEM }}"
        run: |
          echo "$PEM_SECRET" > identity.pem
          echo "$FLEET_ALPHA" > identity_alpha.pem
          echo "$FLEET_BETA" > identity_beta.pem
          echo "$FLEET_GAMMA" > identity_gamma.pem
          
      - name: Run Close Call Trading Fleet Daemon
        env:
          FLEET_PASSWORD: "${{ secrets.FLEET_PASSWORD }}"
          IDENTITY_PASSWORD: "${{ secrets.IDENTITY_PASSWORD }}"
        # Run continuously inside the runner for 5.5 hours
        run: python close_call_bot.py --duration 5.5 &

      - name: Run Continuous Oracle Daemon
        env:
          IDENTITY_PASSWORD: "${{ secrets.IDENTITY_PASSWORD }}"
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
        # Run continuously inside the runner for 5.5 hours
        run: python useful_oracle_agent.py --interval 300 --duration 5.5

      - name: Trigger Next Run
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run oracle.yml --ref master
